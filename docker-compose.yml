version: '3.8'

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: ai-interview-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Piston code execution engine
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: ai-interview-piston
    restart: unless-stopped
    environment:
      PISTON_RUN_TIMEOUT: 10000
      PISTON_RUN_CPU_TIME: 10000
      PISTON_LIMIT_OVERRIDES: '{"java":{"run_timeout":10000,"run_cpu_time":10000}}'
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx256m"
    ports:
      - '2000:2000'
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000
    privileged: true
    networks:
      - app-network

  # Backend API server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-interview-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongo:27017/ai-interview?authSource=admin
      JWT_ACCESS_SECRET: your-super-secret-access-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_ACCESS_EXPIRATION: 30m
      JWT_REFRESH_EXPIRATION: 7d
      AI_PROVIDER: mock
      AI_API_KEY: ''
      AI_MODEL: ''
      PISTON_URL: http://piston:2000
      ML_SERVICE_URL: http://ml_service:8000/predict
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
    depends_on:
      - mongo
      - redis
      - piston
      - ml_service
    networks:
      - app-network

  # ML score calibration service
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ai-interview-ml
    restart: unless-stopped
    ports:
      - '8000:8000'
    networks:
      - app-network

  # Frontend (production build served via nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-interview-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge
