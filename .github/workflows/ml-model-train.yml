name: ML Model Train

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml_service/**'
      - '.github/workflows/ml-model-train.yml'

jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Validate trained model file
        run: |
          test -f model.joblib
          python - << 'PY'
          import joblib
          import numpy as np
          bundle = joblib.load('model.joblib')
          model = bundle['model']
          feature_names = bundle['feature_names']
          sample = {
              'testPassRate': 80,
              'executionTime': 150,
              'codeLength': 12,
              'codeCharCount': 420,
              'errorCount': 1,
              'complexityScore': 35,
              'implementationCompleteness': 85,
              'codeQualityScore': 75,
              'passedTestCases': 4,
              'totalTestCases': 5,
              'explanationClarity': 70,
              'reasoningDepth': 65,
              'structuredThinking': 72,
              'approachRelevance': 68,
              'explanationCompleteness': 69,
              'explanationWordCount': 80,
              'hasMeaningfulCode': 1,
              'hasExplanation': 1,
          }
          pred = float(model.predict(np.array([[sample[name] for name in feature_names]], dtype=float))[0])
          print('Sample prediction:', pred)
          assert pred >= 0 and pred <= 100
          PY

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-joblib
          path: ml_service/model.joblib
          if-no-files-found: error
