name: ML API Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml_service/**'
      - '.github/workflows/ml-model-smoke.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Start API
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat uvicorn.log || true
          exit 1

      - name: Smoke test predict endpoint
        run: |
          curl -sS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":{"testPassRate":85,"executionTime":150,"codeLength":90,"errorCount":0,"complexityScore":30}}' \
            > response.json

          python - << 'PY'
          import json
          with open('response.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert 'predictedScore' in data, 'predictedScore missing in response'
          score = float(data['predictedScore'])
          assert 0 <= score <= 100, f'predictedScore out of range: {score}'
          print('Smoke test passed with predictedScore=', score)
          PY

      - name: Print API logs on failure
        if: failure()
        run: cat uvicorn.log || true
