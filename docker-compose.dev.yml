version: '3.8'

# Development-only services (run backend/frontend via npm locally)
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  mongo:
    image: mongo:7
    container_name: ai-interview-mongo-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - dev-network

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: ai-interview-piston-dev
    restart: unless-stopped
    environment:
      PISTON_RUN_TIMEOUT: 10000
      PISTON_RUN_CPU_TIME: 10000
      PISTON_LIMIT_OVERRIDES: '{"java":{"run_timeout":10000,"run_cpu_time":10000}}'
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx256m"
    ports:
      - '2000:2000'
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000
    privileged: true
    networks:
      - dev-network

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ai-interview-ml-dev
    restart: unless-stopped
    ports:
      - '8000:8000'
    networks:
      - dev-network

volumes:
  mongo_dev_data:

networks:
  dev-network:
    driver: bridge
